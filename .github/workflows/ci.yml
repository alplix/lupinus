name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  WAILS_VERSION: 'v2.15.0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache frontend
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Check version sync
        run: |
          node scripts/sync-version.mjs
          if ! git diff --exit-code; then
            echo "::error::wails.json / frontend/package.json are out of sync with internal/version/version.go. Run 'node scripts/sync-version.mjs' and commit the result."
            exit 1
          fi

      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Wails build (linux/amd64 smoke test)
        run: wails build -platform linux/amd64 -clean
