name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  WAILS_VERSION: 'v2.15.0'
  APP_ID: dev.alplix.lupinus

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify version sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check wails.json / frontend/package.json match internal/version/version.go
        run: |
          node scripts/sync-version.mjs
          if ! git diff --exit-code; then
            echo "::error::wails.json / frontend/package.json are out of sync with internal/version/version.go. Run 'node scripts/sync-version.mjs', commit, and re-tag."
            exit 1
          fi

  build-windows:
    name: Build windows/${{ matrix.arch }}
    needs: [verify-version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, '386']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install mingw, nsis and GTK dependencies
        # mingw/nsis cross-compile the actual windows output; the GTK stack
        # is unrelated to that target but still required because `wails
        # build`'s bindings-generation step compiles and runs a real helper
        # binary for the HOST platform (linux) first, and that binary links
        # the app's own dependencies (systray -> GTK/appindicator, plus
        # Wails' own linux webview backend) regardless of what -platform
        # was requested. Neither the app's own code nor Wails' windows
        # backend needs CGO for the actual windows/${{ matrix.arch }}
        # binary itself (both are pure Go + syscalls on that OS), so no
        # arm64 mingw cross-toolchain is needed even for that target.
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build (NSIS installer)
        # -tags webkit2_41: ubuntu-latest only ships libwebkit2gtk-4.1-dev
        # (4.0 was dropped from the distro); needed for the same
        # host-bindings-helper reason as the GTK packages above.
        #
        # 386 has no installer here: Wails' default project.nsi template
        # only wires up amd64/arm64 (its architecture-select logic doesn't
        # know about 386 at all), so -nsis fails outright for it —
        # "cannot build nsis installer - no windows targets" — even
        # though the plain binary itself compiles fine.
        if: matrix.arch != '386'
        run: wails build -platform windows/${{ matrix.arch }} -tags webkit2_41 -clean -nsis -webview2 download

      - name: Build (no installer)
        if: matrix.arch == '386'
        run: wails build -platform windows/386 -tags webkit2_41 -clean -webview2 download

      - name: Stage portable zip and installer
        working-directory: build/bin
        # The NSIS installer's output name comes from wails.json's "name"
        # (Info.PROJECTNAME in its default project.nsi template), not
        # "outputfilename" — those differ here ("Lupinus" vs "lupinus").
        run: |
          mv lupinus.exe lupinus-windows-${{ matrix.arch }}.exe
          zip -r ../../lupinus-windows-${{ matrix.arch }}.zip lupinus-windows-${{ matrix.arch }}.exe
          if [ "${{ matrix.arch }}" != "386" ]; then
            mv Lupinus-${{ matrix.arch }}-installer.exe ../../lupinus-windows-${{ matrix.arch }}-setup.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lupinus-windows-${{ matrix.arch }}
          # 386 has no setup.exe (see above) — that path simply won't
          # match anything for that job, which is fine: at least one of
          # the two listed paths resolving is enough for upload-artifact
          # not to treat it as "no files found".
          if-no-files-found: error
          path: |
            lupinus-windows-${{ matrix.arch }}.zip
            lupinus-windows-${{ matrix.arch }}-setup.exe

  build-linux:
    name: Build linux ${{ matrix.arch }}
    needs: [verify-version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per arch, not cross-compiled from amd64: CGO
          # (required by the webview/systray stack) needs a matching-arch
          # C toolchain, and cross-arch CGO on GitHub's ubuntu-latest
          # doesn't have one set up out of the box.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        # -tags webkit2_41: see build-windows's comment on the same flag.
        run: wails build -platform linux/${{ matrix.arch }} -tags webkit2_41 -clean

      - name: Stage archive
        working-directory: build/bin
        run: |
          mv lupinus lupinus-linux-${{ matrix.arch }}
          tar -czf ../../lupinus-linux-${{ matrix.arch }}.tar.gz lupinus-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lupinus-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: lupinus-linux-${{ matrix.arch }}.tar.gz

  build-linux-arm:
    name: Build linux arm (32-bit)
    needs: [verify-version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build inside an emulated armv7 container
        # Unlike riscv64 (dropped, unsupported by Wails itself — see the
        # git history), "linux/arm" IS one of Wails' own supported
        # -platform values, and Go/CGO both support armv7 — there's just
        # no native 32-bit ARM GitHub-hosted runner and no ready cross
        # toolchain with matching armhf GTK/webkit2gtk dev packages on
        # the amd64 runners, so this builds natively inside a QEMU-
        # emulated armv7 container instead, the same pattern that
        # successfully built (just wasn't accepted by wails) for riscv64.
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}:/work" -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            golang:${{ env.GO_VERSION }}-bookworm bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends \
                nodejs npm libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
              go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
              export PATH="$PATH:$(go env GOPATH)/bin"
              wails build -platform linux/arm -tags webkit2_41 -clean
              chown -R "$HOST_UID:$HOST_GID" /work/build
            '

      - name: Stage archive
        working-directory: build/bin
        run: |
          mv lupinus lupinus-linux-arm
          tar -czf ../../lupinus-linux-arm.tar.gz lupinus-linux-arm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lupinus-linux-arm
          if-no-files-found: error
          path: lupinus-linux-arm.tar.gz

  build-darwin:
    name: Build darwin universal
    needs: [verify-version]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        # A single fat (lipo-merged) binary covering both Apple Silicon
        # and Intel Macs, instead of shipping two separate downloads —
        # Wails builds each arch and merges them itself.
        run: wails build -platform darwin/universal -clean

      - name: Stage archive
        working-directory: build/bin
        run: |
          APP="$(find . -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then echo "No .app bundle produced"; exit 1; fi
          ditto -c -k --keepParent "$APP" ../../lupinus-darwin-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lupinus-darwin-universal
          if-no-files-found: error
          path: lupinus-darwin-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-linux-arm, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
